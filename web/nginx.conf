server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_read_timeout 600s;   # strategy generation can take a minute or two
  }

  # The LuxAlgo trade journal's own API, so the dashboard can read its statistics.
  location /journal-api/ {
    proxy_pass http://journal:3000/api/;
  }

  location / {
    # Make the browser check for a new page after each rebuild instead of showing an old copy.
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
